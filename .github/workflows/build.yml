name: test-all-desktop-035
run-name: BiliMusic 0.3.5 test installers — Windows, Intel Mac and Linux
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_SOURCE: ${{ github.sha }}
jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: v035-shared-frontend
          path: dist/
          retention-days: 7
          if-no-files-found: error
  desktop:
    needs: frontend
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            bundle: dmg
            artifact: bilimusic-macOS-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            bundle: nsis
            artifact: bilimusic-Windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            bundle: nsis
            artifact: bilimusic-Windows-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            bundle: appimage,deb
            artifact: bilimusic-Linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            bundle: appimage,deb
            artifact: bilimusic-Linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE }}
      - name: Verify exact published source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          git diff --exit-code
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: v034-extra-${{ matrix.target }}
          cache-on-failure: true
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libasound2-dev patchelf xdg-utils xvfb dbus-x11
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: v035-shared-frontend
          path: dist
      - name: Prepare verified NSIS toolchain through GitHub API
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # These versions and hashes match the locked Tauri CLI 2.11.4.
          $cli = node -p "require('@tauri-apps/cli/package.json').version"
          if ($cli -ne '2.11.4') { throw 'Update NSIS toolchain pins for the new Tauri CLI.' }
          $stage = Join-Path $env:RUNNER_TEMP 'bilimusic-nsis'
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($asset in @(
            @{ Repo='tauri-apps/binary-releases'; Tag='nsis-3.11'; Name='nsis-3.11.zip'; Hash='EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D' },
            @{ Repo='tauri-apps/nsis-tauri-utils'; Tag='nsis_tauri_utils-v0.5.3'; Name='nsis_tauri_utils.dll'; Hash='75197FEE3C6A814FE035788D1C34EAD39349B860' }
          )) {
            for ($attempt=1; $attempt -le 4; $attempt++) {
              gh release download $asset.Tag -R $asset.Repo -p $asset.Name -D $stage --clobber
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { throw "Failed to download $($asset.Name)" }
              Start-Sleep -Seconds 3
            }
            if ((Get-FileHash (Join-Path $stage $asset.Name) -Algorithm SHA1).Hash -ne $asset.Hash) { throw 'NSIS toolchain checksum mismatch' }
          }
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Expand-Archive (Join-Path $stage 'nsis-3.11.zip') -DestinationPath $stage -Force
          $nsis = Join-Path $tools 'NSIS'
          if (Test-Path $nsis) { Remove-Item $nsis -Recurse -Force }
          Move-Item (Join-Path $stage 'nsis-3.11') $nsis
          $plugins = Join-Path $nsis 'Plugins/x86-unicode/additional'
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Copy-Item (Join-Path $stage 'nsis_tauri_utils.dll') $plugins
      - name: Configure shared frontend reuse
        shell: bash
        run: node -e "require('fs').writeFileSync('ci-bundle-config.json', JSON.stringify({build:{beforeBuildCommand:null}}))"
      - name: Build published source for selected architecture
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if [ '${{ runner.os }}' != Linux ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              npm run build:updater -- --ci --target ${{ matrix.target }} --config ci-bundle-config.json && exit 0
            else
              npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config ci-bundle-config.json && exit 0
            fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            sleep 5
          done
      - name: Verify Intel macOS DMG and application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          hdiutil verify "$dmg"
          mount_dir=$(mktemp -d)
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          app="$mount_dir/BiliMusic.app"
          binary="$app/Contents/MacOS/bilimusic-desktop"
          file "$binary"
          test "$(lipo -archs "$binary")" = x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist" | grep -x 0.3.5
      - name: Verify Windows ARM64 application and GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes((Resolve-Path 'src-tauri/target/${{ matrix.target }}/release/bilimusic-desktop.exe'))
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 0xAA64 } else { 0x8664 }; if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne $expected) { throw 'Unexpected machine type' }
          if ([BitConverter]::ToUInt16($binary, $pe + 92) -ne 2) { throw 'Expected GUI subsystem' }
      - name: Verify Linux binaries and DEB package architecture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary=src-tauri/target/${{ matrix.target }}/release/bilimusic-desktop
          file "$binary"
          if [ '${{ matrix.arch }}' = arm64 ]; then readelf -h "$binary" | grep -q AArch64; expected=arm64; else readelf -h "$binary" | grep -q 'X86-64'; expected=amd64; fi
          deb=$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -name '*.deb' -print -quit)
          test "$(dpkg-deb -f "$deb" Architecture)" = "$expected"
          test "$(dpkg-deb -f "$deb" Version)" = 0.3.5
          ! ldd "$binary" | grep 'not found'
          set +e
          timeout 18s dbus-run-session -- xvfb-run -a "$binary" > linux-launch.log 2>&1
          status=$?
          set -e
          cat linux-launch.log
          test "$status" = 124
      - name: Generate dependency notices and build provenance
        shell: bash
        run: |
          node scripts/release-notices.mjs ${{ matrix.target }} THIRD_PARTY_LICENSES-${{ matrix.artifact }}.json
          node -e "const fs=require('fs');fs.writeFileSync('build-provenance.json',JSON.stringify({version:'0.3.5',source:process.env.RELEASE_SOURCE,target:'${{ matrix.target }}',runner:'${{ matrix.os }}',run:process.env.GITHUB_RUN_ID},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            THIRD_PARTY_LICENSES-${{ matrix.artifact }}.json
            build-provenance.json
            linux-launch.log
          if-no-files-found: error
