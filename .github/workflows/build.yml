name: desktop-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:large-screen
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-targets
          path: |
            dist/frontend-build.json
            dist-large-screen/frontend-build.json
          if-no-files-found: error
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: npm run test:rust
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: bilimusic-macos
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: bilimusic-windows
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build desktop installer and optional signed OTA artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run build:updater
          else
            npm run tauri build -- --bundles ${{ matrix.bundle }}
          fi
      - name: Verify packaged macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          mount_dir=$(mktemp -d)
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/BiliMusic.app"
          test -f "$mount_dir/BiliMusic.app/Contents/_CodeSignature/CodeResources"
          codesign -dv --verbose=3 "$mount_dir/BiliMusic.app"
      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes((Resolve-Path 'src-tauri/target/release/bilimusic-desktop.exe'))
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($binary, $peOffset + 92)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem" }
          Write-Output 'Windows GUI subsystem verified: no release console window'
      - run: node scripts/release-notices.mjs ${{ matrix.target }} release-notices-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
            src-tauri/target/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/release/bundle/nsis/*.exe.sig
            release-notices-${{ runner.os }}.json
            dist/frontend-build.json
          if-no-files-found: error
