name: desktop-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: bilimusic-macos
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: bilimusic-windows
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes((Resolve-Path 'src-tauri/target/release/bilimusic-desktop.exe'))
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($binary, $peOffset + 92)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem" }
          Write-Output 'Windows GUI subsystem verified: no release console window'
      - run: node scripts/release-notices.mjs ${{ matrix.target }} release-notices-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
            release-notices-${{ runner.os }}.json
          if-no-files-found: error
