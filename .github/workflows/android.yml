name: android-build
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Android phone and tablet build number
        type: number
        default: 1
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'native/**', 'scripts/android-*', 'package*', 'vite.config.ts', '.github/workflows/android.yml']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'native/**', '.github/workflows/android.yml']
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      BILIMUSIC_BUILD_NUMBER: ${{ inputs.build_number || 1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run android:init
      # Optimized native code and stripped symbols; sign the release APK with the existing preview key.
      - run: npm run android:build
      - run: node scripts/verify-frontend-build.mjs dist standard chrome105 android
      - name: Test media controls and native lyric rendering
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-android-player:testReleaseUnitTest --no-daemon
      - run: node scripts/android-verify-acl.mjs
      - name: Sign preview with persistent repository key
        env:
          PREVIEW_KEY: ${{ secrets.BILIMUSIC_ANDROID_PREVIEW_KEY_DER }}
          PREVIEW_CERT: ${{ secrets.BILIMUSIC_ANDROID_PREVIEW_CERT_PEM }}
        run: |
          if [ -n "$PREVIEW_KEY" ] && [ -n "$PREVIEW_CERT" ]; then
            signing_dir=$(mktemp -d)
            trap 'rm -rf "$signing_dir"' EXIT
            printf '%s' "$PREVIEW_KEY" | base64 --decode > "$signing_dir/key.der"
            printf '%s' "$PREVIEW_CERT" > "$signing_dir/cert.pem"
            APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --key "$signing_dir/key.der" --cert "$signing_dir/cert.pem" "$APK"
          else
            echo 'Persistent signing key is required to preserve upgrade compatibility.'
            exit 1
          fi
      - name: Verify APK package
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -8
          expected_code=$(node --input-type=module -e "import {mobileVersion} from './scripts/mobile-version.mjs'; import {readFileSync} from 'node:fs'; console.log(mobileVersion(JSON.parse(readFileSync('package.json')).version).androidVersionCode)")
          actual_badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          [[ "$actual_badging" == *"versionCode='$expected_code'"* ]] || { echo 'APK upgrade versionCode mismatch'; exit 1; }
          python3 - "$APK" <<'PYAPK'
          import sys, zipfile, os
          path=sys.argv[1]
          with zipfile.ZipFile(path) as z:
            libraries=[f for f in z.infolist() if f.filename.endswith('.so')]
            for f in libraries: print(f.filename, f.file_size, 'bytes')
            assert all(f.file_size < 30*1024*1024 for f in libraries), 'Unstripped native library in APK'
            dex=b''.join(z.read(f.filename) for f in z.infolist() if f.filename.endswith('.dex'))
            for cls in ['PlayerPlugin','PlayArgs','ControlArgs','SecretArgs']:
              assert ('Lapp/bilimusic/player/'+cls+';').encode() in dex, 'Native bridge removed by shrinker: '+cls
            for name in ['setWebView','getCookies','clearAllBrowsingData','loadUrlMainThread','loadHTMLMainThread','evalScript']:
              assert name.encode() in dex, 'wry JNI method removed by shrinker: '+name
          assert os.path.getsize(path) < 40*1024*1024, 'APK unexpectedly exceeds 40MB'
          PYAPK
      - uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-Android-arm64-preview
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            android-bridge-acl.json
            dist/frontend-build.json
            native/android-player/android/build/test-results/testReleaseUnitTest/*.xml
            native/android-player/android/build/reports/lyric-previews/*.png
          if-no-files-found: error
      - name: Upload failed native test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-native-test-diagnostics
          path: |
            native/android-player/android/build/test-results/testReleaseUnitTest/*.xml
            native/android-player/android/build/reports/tests/testReleaseUnitTest/**
            native/android-player/android/build/reports/lyric-previews/*.png
          if-no-files-found: ignore
