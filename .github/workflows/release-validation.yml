name: release-workflow-validation
on:
  workflow_dispatch:
  push:
    paths: ['scripts/publish_release.py', 'scripts/prepare_release.py', 'scripts/release_packages.py', 'scripts/verify_release_downloads.mjs', 'scripts/backup_release_metadata.mjs', 'scripts/tests/**', '.github/workflows/release-validation.yml']
  pull_request:
    paths: ['scripts/publish_release.py', 'scripts/prepare_release.py', 'scripts/release_packages.py', 'scripts/verify_release_downloads.mjs', 'scripts/backup_release_metadata.mjs', 'scripts/tests/**', '.github/workflows/release-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m unittest discover -s scripts/tests -p 'test_release*.py' -v
      - run: node --test scripts/tests/test_release_downloads.mjs
