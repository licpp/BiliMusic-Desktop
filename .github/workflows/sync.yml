name: cloud-sync-tests
on:
  pull_request:
    paths: ['cloud-sync/**', '.github/workflows/sync.yml']
  push:
    branches: [main]
    paths: ['cloud-sync/**', '.github/workflows/sync.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: cloud-sync
      - run: npm test
        working-directory: cloud-sync
